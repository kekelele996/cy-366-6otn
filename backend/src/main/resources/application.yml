server:
  port: ${PORT:29506}

spring:
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:h2:mem:app;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}"
    driver-class-name: "${SPRING_DATASOURCE_DRIVER:org.h2.Driver}"
    username: "${DB_USER:sa}"
    password: "${DB_PASSWORD:}"
  sql:
    init:
      mode: always
      encoding: UTF-8

mybatis:
  configuration:
    map-underscore-to-camel-case: true
